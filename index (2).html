<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <script>
      window.__dev = function () {
        var v = "";
        try {
          v = localStorage.getItem("dash_view") || "";
        } catch (e) {}
        if (v === "mobile" || v === "desktop") return v;
        return /iPhone|iPod|Android.*Mobile|Mobile/i.test(navigator.userAgent) ||
          Math.min(screen.width, screen.height) <= 480
          ? "mobile"
          : "desktop";
      };
      document.documentElement.dataset.dev = __dev();
    </script>
    <title>HATIM HUB | مركز حاتم</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1324;
        --s1: #111b33;
        --s2: #182544;
        --bd: #233456;
        --tx: #e8edf8;
        --mu: #8793b0;
        --ac: #ffbe3b;
        --ac2: #6fb8ff;
        --col: #0e172b;
        --ok: #7fd6a4;
        --no: #ff6b5e;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: var(--bd) transparent;
      }
      ::selection {
        background: var(--ac);
        color: #17130a;
      }
      body {
        overflow-x: clip;
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family: "Cairo", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.7;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        background: var(--bg);
        z-index: 30;
      }
      .mu {
        color: var(--mu);
      }
      .mono,
      .num,
      .day {
        font-variant-numeric: tabular-nums;
      }
      .card {
        position: relative;
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: 2px;
      }
      .card > h2 {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-size: 1.02rem;
        font-weight: 700;
        color: var(--ac);
        margin-bottom: 0.9rem;
        padding-bottom: 0.55rem;
        border-bottom: 1.5px solid color-mix(in srgb, var(--ac) 38%, var(--bd));
      }
      .card > h2::before {
        content: "";
        width: 4px;
        height: 1.05rem;
        background: var(--ac);
        flex: none;
      }
      .st {
        padding: 1.1rem 1.3rem;
        background: color-mix(in srgb, var(--ac) 9%, var(--s1));
        border-color: color-mix(in srgb, var(--ac) 28%, var(--bd));
      }
      .st::before,
      .st::after {
        content: "";
        position: absolute;
        width: 11px;
        height: 11px;
        border: 0 solid var(--ac);
        pointer-events: none;
      }
      .st::before {
        top: -1px;
        inset-inline-start: -1px;
        border-block-start-width: 2px;
        border-inline-start-width: 2px;
      }
      .st::after {
        bottom: -1px;
        inset-inline-end: -1px;
        border-block-end-width: 2px;
        border-inline-end-width: 2px;
      }
      .lbl {
        font-size: 0.82rem;
        color: var(--mu);
      }
      .num {
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        font-weight: 500;
        line-height: 1.15;
        margin-top: 0.5rem;
        font-variant-numeric: tabular-nums;
      }
      .tag {
        display: inline-block;
        min-width: 3.3rem;
        text-align: center;
        font-size: 0.7rem;
        padding: 0 0.45rem;
        border: 1px solid color-mix(in srgb, var(--ac2) 45%, transparent);
        color: var(--ac2);
        border-radius: 2px;
        white-space: nowrap;
      }
      .btn {
        background: transparent;
        border: 1px solid var(--bd);
        border-radius: 2px;
        padding: 0.4rem 0.9rem;
        color: var(--tx);
        cursor: pointer;
        font: inherit;
        font-size: 0.88rem;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .btn:hover {
        border-color: var(--ac);
      }
      .btn:disabled {
        opacity: 0.3;
        cursor: default;
        border-color: var(--bd);
      }
      .btn.p {
        background: var(--ac);
        border-color: var(--ac);
        color: #17130a;
        font-weight: 600;
      }
      .btn.p:hover {
        filter: brightness(1.1);
      }
      .btn:focus-visible,
      input:focus-visible,
      select:focus-visible,
      .day:focus-visible,
      .nv:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      input,
      select,
      textarea {
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--bd);
        border-radius: 0;
        color: var(--tx);
        padding: 0.45rem 0.1rem;
        width: 100%;
        font: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-bottom-color: var(--ac);
        outline: 0;
      }
      textarea {
        border: 1px solid var(--bd);
        padding: 0.6rem;
      }
      option {
        background: var(--s2);
      }
      input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 1.05rem;
        height: 1.05rem;
        padding: 0;
        flex: none;
        border: 1px solid var(--mu);
        border-radius: 1px;
        display: inline-grid;
        place-content: center;
        cursor: pointer;
      }
      input[type="checkbox"]:checked {
        background: var(--ac);
        border-color: var(--ac);
      }
      input[type="checkbox"]:checked::after {
        content: "";
        width: 0.55rem;
        height: 0.28rem;
        border: solid #17130a;
        border-width: 0 0 2px 2px;
        transform: rotate(-45deg) translate(1px, -1px);
      }
      label {
        display: block;
        font-size: 0.82rem;
        color: var(--mu);
        margin-top: 0.8rem;
      }
      label.ck {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        margin: 0.25rem 0;
        color: var(--tx);
        font-size: 0.9rem;
      }
      .bk {
        position: fixed;
        inset: 0;
        background: #000c;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 1rem;
      }
      .mdl {
        background: var(--s1);
        border: 1px solid var(--bd);
        border-top: 2px solid var(--ac);
        border-radius: 2px;
        padding: 1.3rem;
        width: 100%;
        max-width: 440px;
        max-height: 90vh;
        overflow: auto;
      }
      .side {
        display: flex;
        flex-direction: column;
        width: 240px;
        flex: none;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        align-self: flex-start;
        height: 100vh;
        background: var(--bg);
        border-inline-end: 1px solid var(--bd);
        padding: 1.5rem 0;
      }
      .brand {
        padding: 0 1.3rem 1.4rem;
        margin-bottom: 1rem;
        border-bottom: 1px solid var(--bd);
      }
      .brand .en {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        line-height: 1.25;
      }
      .brand .sub {
        font-size: 0.85rem;
        color: var(--mu);
      }
      .logo {
        width: 46px;
        height: 46px;
        flex: none;
      }
      .gear {
        margin-top: auto;
        align-self: flex-start;
        margin-inline-start: 1.3rem;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: none;
        border: 1px solid var(--bd);
        border-radius: 2px;
        font-size: 1rem;
        cursor: pointer;
        color: var(--tx);
      }
      .gear:hover {
        border-color: var(--ac);
      }
      .tagl {
        margin-top: 1rem;
        padding-top: 0.8rem;
        border-top: 1px dashed var(--bd);
        font-size: 0.74rem;
        color: var(--mu);
      }
      .nv {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        width: 100%;
        margin: 0;
        padding: 0.65rem 1.3rem;
        border: 0;
        border-inline-start: 4px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--mu);
        font: inherit;
        cursor: pointer;
        text-align: start;
      }
      .ic {
        display: inline-block;
        flex: none;
        width: 1.4rem;
        text-align: center;
        font-size: 1.1rem;
        line-height: 1;
      }
      button.mu {
        color: var(--ac2);
        cursor: pointer;
      }
      button.mu:hover {
        filter: brightness(1.25);
      }
      .nv:hover {
        color: var(--tx);
      }
      .nv.on {
        color: #fff;
        font-weight: 600;
        border-inline-start-color: var(--ac);
        background: color-mix(in srgb, var(--ac) 24%, transparent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ac) 40%, transparent);
      }
      .nv.on::after {
        content: "";
        margin-inline-start: auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ac);
      }

      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: var(--bg);
        border-bottom: 1px solid var(--bd);
      }
      #ttl {
        font-size: 1.1rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.35rem 0.9rem;
        border-radius: 4px;
        border: 1px solid color-mix(in srgb, var(--ac2) 55%, transparent);
        background: color-mix(in srgb, var(--ac2) 15%, transparent);
      }

      #tc {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.3;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        padding-inline-end: 0.9rem;
        margin-inline-end: 0.1rem;
        border-inline-end: 1px solid var(--bd);
      }
      #tc .tm {
        display: inline-block;
        min-width: 6.5rem;
        text-align: center;
        font-size: 1.15rem;
        font-weight: 500;
        color: var(--tx);
      }
      #tc small {
        font-size: 0.72rem;
        color: var(--ac);
        margin-inline-start: 0.25rem;
      }
      #tc .dt {
        font-size: 0.74rem;
        color: var(--mu);
      }
      @media (min-width: 768px) {
        #tc {
          min-width: 11.5rem;
        }
      }

      .col {
        background: var(--col);
        border: 1px solid var(--bd);
        border-radius: 2px;
        padding: 0.7rem;
        min-height: 240px;
      }
      .day {
        aspect-ratio: 1;
        min-height: 42px;
        border: 1px solid var(--bd);
        border-radius: 0;
        background: transparent;
        color: var(--tx);
        font-size: 0.9rem;
        cursor: pointer;
        position: relative;
      }
      .day:hover {
        border-color: var(--mu);
      }
      .day.tod {
        box-shadow: inset 0 -2px var(--ac);
      }
      .day.sel {
        background: var(--ac);
        border-color: var(--ac);
        color: #17130a;
        font-weight: 600;
      }
      .day i {
        position: absolute;
        bottom: 5px;
        inset-inline: 0;
        margin: auto;
        width: 4px;
        height: 4px;
        background: currentColor;
      }
      .bar {
        height: 4px;
        background: var(--ac);
      }

      [data-dev="mobile"] .side {
        position: fixed;
        inset: auto 0 0 0;
        width: auto;
        height: auto;
        display: flex;
        flex-direction: row;
        border-top: 1px solid var(--bd);
        border-inline-end: 0;
        padding: 0 0 env(safe-area-inset-bottom, 0px);
        z-index: 25;
        top: auto;
      }
      [data-dev="mobile"] .side .brand,
      [data-dev="mobile"] .side .gear {
        display: none;
      }
      [data-dev="mobile"] .side nav {
        display: flex;
        width: 100%;
      }
      [data-dev="mobile"] .nv {
        flex-direction: column;
        align-items: center;
        gap: 0;
        font-size: 0.66rem;
        padding: 0.45rem 0.1rem;
        text-align: center;
        border-inline-start: 0;
        border-block-start: 3px solid transparent;
        flex: 1;
      }
      [data-dev="mobile"] .nv.on {
        border-block-start-color: var(--ac);
        box-shadow: none;
      }
      [data-dev="mobile"] .nv.on::after {
        display: none;
      }
      [data-dev="mobile"] main {
        padding-bottom: 6rem !important;
      }
      .hmob {
        display: none;
      }
      [data-dev="mobile"] .hmob {
        display: inline-block;
      }
      .trow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.7rem;
        padding: 0.7rem 0.5rem;
        border-bottom: 1px solid var(--bd);
      }
      .trow:last-child {
        border-bottom: 0;
      }
      .dchip {
        display: inline-block;
        font-size: 0.78rem;
        padding: 0.05rem 0.6rem;
        border: 1px solid var(--bd);
        border-radius: 2px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        color: var(--mu);
      }
      .dchip.od {
        color: var(--no);
        border-color: color-mix(in srgb, var(--no) 55%, transparent);
        background: color-mix(in srgb, var(--no) 14%, transparent);
      }
      .dchip.td {
        color: #17130a;
        background: var(--ac);
        border-color: var(--ac);
        font-weight: 600;
      }
      .dchip.nr {
        color: var(--ac2);
        border-color: color-mix(in srgb, var(--ac2) 55%, transparent);
        background: color-mix(in srgb, var(--ac2) 14%, transparent);
      }
      [dir="rtl"] .cb {
        order: 99;
      }
      .tag.t {
        color: var(--ac);
        border-color: color-mix(in srgb, var(--ac) 45%, transparent);
      }
      button.tag {
        cursor: pointer;
        background: none;
        font: inherit;
        font-size: 0.7rem;
        line-height: inherit;
      }
      button.tag:hover {
        background: color-mix(in srgb, var(--ac) 12%, transparent);
      }
      .s-task {
        --sc: #5fd3a1;
      }
      .s-prod {
        --sc: #b79cff;
      }
      .s-study {
        --sc: #ff9f6b;
      }
      .s-ev {
        --sc: #f08fc0;
      }
      .srow {
        border-inline-start: 3px solid var(--sc);
        padding-inline-start: 0.7rem;
      }
      .srow .tag {
        color: var(--sc);
        border-color: color-mix(in srgb, var(--sc) 50%, transparent);
        background: color-mix(in srgb, var(--sc) 12%, transparent);
      }
      .lg::before {
        content: "";
        display: inline-block;
        width: 0.6rem;
        height: 0.6rem;
        margin-inline-end: 0.35rem;
        background: var(--sc);
      }
      .card.s-study > h2 {
        color: var(--sc);
        border-bottom-color: color-mix(in srgb, var(--sc) 40%, var(--bd));
      }
      .card.s-study > h2::before {
        background: var(--sc);
      }
      .card.s-dl > h2 {
        color: #8fd26a;
        border-bottom-color: color-mix(in srgb, #8fd26a 40%, var(--bd));
      }
      .card.s-dl > h2::before {
        background: #8fd26a;
      }
      .trow .tn {
        flex: 1;
        min-width: 11rem;
      }
      .thd {
        color: var(--mu);
        font-size: 0.8rem;
        border-bottom-color: var(--ac);
        padding-block: 0.45rem;
      }
      .chw {
        width: 7.5rem;
      }
      .chip.stg {
        width: auto;
        flex: 1;
        min-width: 0;
        font-weight: 600;
        color: var(--sc);
        border-color: color-mix(in srgb, var(--sc) 55%, transparent);
        background: color-mix(in srgb, var(--sc) 12%, transparent);
      }
      .chip {
        width: 7.5rem;
        padding: 0.3rem 0.6rem;
        border: 1px solid var(--bd);
        border-radius: 2px;
        background: var(--s2);
        color: var(--mu);
        font-size: 0.82rem;
        cursor: pointer;
      }
      .chip.imp.on {
        color: var(--ac);
        border-color: color-mix(in srgb, var(--ac) 55%, transparent);
        background: color-mix(in srgb, var(--ac) 12%, transparent);
      }
      .chip.urg.on {
        color: var(--no);
        border-color: color-mix(in srgb, var(--no) 55%, transparent);
        background: color-mix(in srgb, var(--no) 12%, transparent);
      }
      [data-dev="mobile"] .thd {
        display: none;
      }
      .pipe {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 0.5rem;
      }
      .seg {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.05rem;
        padding: 0.55rem 0.3rem;
        background: var(--s1);
        border: 1px solid var(--bd);
        border-top: 3px solid var(--c);
        border-radius: 2px;
        color: var(--mu);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        line-height: 1.3;
      }
      .seg b {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--tx);
        font-variant-numeric: tabular-nums;
      }
      .seg:hover {
        border-color: var(--c);
      }
      .seg.on {
        background: color-mix(in srgb, var(--c) 18%, var(--s1));
        border-color: var(--c);
        color: var(--tx);
        font-weight: 600;
      }
      .seg.on b {
        color: var(--c);
      }
      [data-dev="mobile"] .pipe {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .steps {
        display: flex;
        gap: 4px;
      }
      .stp {
        flex: 1;
        height: 9px;
        padding: 0;
        border: 0;
        border-radius: 1px;
        background: var(--bd);
        cursor: pointer;
      }
      .stp.on {
        background: var(--c);
      }
      .stp:hover {
        filter: brightness(1.3);
      }
      .stp.cur {
        box-shadow:
          0 0 0 2px var(--s1),
          0 0 0 3px var(--c);
      }
      .pcard {
        display: flex;
        flex-direction: column;
        min-height: 9.5rem;
        border-top: 3px solid var(--sc);
        padding: 0.6rem 0.75rem;
        font-size: 0.9rem;
      }
      .pgrid {
        grid-auto-rows: 1fr;
      }
      .tr1 {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pcard .btn {
        padding: 0.22rem 0.6rem;
        font-size: 0.8rem;
      }
      .mlab {
        font-size: 0.82rem;
        color: var(--mu);
        margin-top: 0.8rem;
      }
      .mch {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0;
        padding: 0.3rem 0.7rem;
        border: 1px solid var(--bd);
        border-radius: 2px;
        color: var(--tx);
        font-size: 0.88rem;
        cursor: pointer;
      }
      .mch:has(input:checked) {
        border-color: var(--ac);
        background: color-mix(in srgb, var(--ac) 14%, transparent);
        color: var(--ac);
      }
    </style>
  </head>
  <body>
    <div class="flex min-h-screen">
      <aside class="side">
        <div class="brand">
          <div class="flex items-center gap-3">
            <svg class="logo" viewBox="0 0 44 44" fill="none" role="img" aria-label="HATIM HUB">
              <path
                d="M4 14V6a2 2 0 0 1 2-2h8M30 4h8a2 2 0 0 1 2 2v8M40 30v8a2 2 0 0 1-2 2h-8M14 40H6a2 2 0 0 1-2-2v-8"
                stroke="var(--ac)"
                stroke-width="2.6"
                stroke-linecap="round"
              />
              <path
                d="M16 14v16M28 14v16M16 22h12"
                stroke="var(--tx)"
                stroke-width="3"
                stroke-linecap="round"
              />
              <circle cx="22" cy="22" r="2.4" fill="var(--ac2)" />
            </svg>
            <div>
              <div class="en">HATIM HUB</div>
              <div class="sub">مركز حاتم</div>
            </div>
          </div>
          <div class="tagl">الإدارة العامة</div>
        </div>
        <nav id="nav"></nav>
        <button class="gear" onclick="settings()" aria-label="الإعدادات" title="الإعدادات">⚙️</button>
      </aside>
      <div class="flex-1 min-w-0">
        <header class="flex flex-wrap items-center justify-between gap-2 px-4 py-3 md:px-6">
          <h1 id="ttl"></h1>
          <div class="flex flex-wrap items-center justify-end gap-2 md:gap-3">
            <span id="syn" class="text-sm mu" style="white-space: nowrap"></span
            ><span id="tc" class="text-sm mu"></span
            ><button class="btn hmob" onclick="settings()" aria-label="الإعدادات" title="الإعدادات">⚙️</button
            ><button class="btn p" onclick="quick()">＋ إضافة سريعة</button>
          </div>
        </header>
        <main id="main" class="p-4 md:p-6"></main>
      </div>
    </div>
    <div id="modal"></div>
    <script>

      async function dlf() {

          if (dl) {

            sl(LB, Date.now());
            return;

          if (e && e.code === "declined") return;
        }
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" }));

        sl(LB, Date.now());

                    rcp[x.id] = 2;
                    toast("مرفق كبير لا يُزامَن، ويبقى على هذا الجهاز فقط.");
                  } else {
                    await SYNC.col.doc("rc_" + x.id).set({ n: x.rc.n, t: x.rc.t, d: x.rc.d });
                    rcp[x.id] = 1;
                  }
                }
            await d.set({ ts: mod[k] || Date.now(), items: dehyd(k, S[k]) });
            pend.delete(k);
          }
          lsj("dash_rcp", rcp);
          setSt("ok");
        } catch (e) {
          setSt("err");
        }
      }
      const queue = () => {
        clearTimeout(pt);
        pt = setTimeout(flush, 1200);
      };
      async function pullCloud() {
        const m = $("#pcm"),
          say = (t) => m && (m.textContent = t);
        if (!SYNC.on || !SYNC.col) return say("المزامنة غير متصلة. افتح الموقع من رابط claude.ai أو اربط GitHub.");
        say("جارٍ السحب…");
        try {
          let n = 0;
          for (const k of SK) {
            const sn = await SYNC.col.doc("hub_" + k).get();
            if (sn.exists) {
              const r = sn.data() || {};
              adopt(k, r.items || [], r.ts || Date.now());
              pend.delete(k);
              syn1[k] = 1;
              n += (r.items || []).length;
            }
          }
          lsj("dash_syn1", syn1);
          setSt("ok");
          settings();
          const e = $("#pcm");
          if (e) e.textContent = n ? "تم استرجاع " + n + " عنصر من السحابة ✓" : "السحابة فاضية.";
        } catch (e) {
          say("تعذّر السحب: " + ((e && (e.code || e.message)) || e));
        }
      }
      async function syncNow() {
        if (!SYNC.on) return;
        setSt("connecting");
        try {
          for (const k of SK) onRemote(k, await SYNC.col.doc("hub_" + k).get());
          if (pend.size) await flush();
          else setSt("ok");
        } catch (e) {
          setSt("err");
        }
        settings();
      }
      /* GitHub Gist backend (for copies hosted outside claude.ai) */
      const ghTok = () => {
        try {
          return localStorage.getItem("dash_gh") || "";
        } catch (e) {
          return "";
        }
      };
      async function ghSetup(tok) {
        const H = { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json" };
        let r = await fetch("https://api.github.com/gists?per_page=100", { headers: H });
        if (!r.ok) throw new Error("auth");
        let g = (await r.json()).find((x) => x.description === "HATIM HUB data");
        if (!g) {
          r = await fetch("https://api.github.com/gists", {
            method: "POST",
            headers: { ...H, "Content-Type": "application/json" },
            body: JSON.stringify({
              description: "HATIM HUB data",
              public: false,
              files: { "readme.json": { content: '{"app":"HATIM HUB"}' } },
            }),
          });
          if (!r.ok) throw new Error("create");
          g = await r.json();
        }
        return g.id;
      }
      function ghCol(tok, gid) {
        const H = { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json" },
          cache = {},
          ls = new Map();
        let etag = "",
          cur = null,
          done = false;
        const api = (u, o = {}) =>
          fetch("https://api.github.com" + u, { ...o, headers: { ...H, ...(o.headers || {}) } });
        const snap = (n) => ({
          exists: n in cache,
          data: () => cache[n],
          metadata: { fromCache: false, hasPendingWrites: false },
        });
        async function run() {
          const r = await api("/gists/" + gid, { headers: etag ? { "If-None-Match": etag } : {} });
          if (r.status !== 304) {
            if (!r.ok) throw new Error(r.status);
            etag = r.headers.get("etag") || "";
            const j = await r.json(),
              ch = [];
            for (const [f, v] of Object.entries(j.files)) {
              const n = f.replace(/\.json$/, "");
              if (n === "readme") continue;
              let t = v.content;
              if (v.truncated) t = await (await fetch(v.raw_url)).text();
              let o;
              try {
                o = JSON.parse(t);
              } catch (e) {
                continue;
              }
              if (JSON.stringify(cache[n]) !== JSON.stringify(o)) {
                cache[n] = o;
                ch.push(n);
              }
            }
            ch.forEach((n) => ls.has(n) && ls.get(n).forEach((cb) => cb(snap(n))));
          }
          if (!done) {
            done = true;
            ls.forEach((cbs, n) => {
              if (!(n in cache)) cbs.forEach((cb) => cb(snap(n)));
            });
          }
        }
        const load = () =>
          cur ||
          (cur = run().finally(() => {
            cur = null;
          }));
        async function put(n, d) {
          const r = await api("/gists/" + gid, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ files: { [n + ".json"]: { content: JSON.stringify(d) } } }),
          });
          if (!r.ok) throw new Error(r.status);
          cache[n] = d;
          etag = "";
        }
        return {
          doc: (n) => ({
            get: async () => {
              await load();
              return snap(n);
            },
            set: (d) => put(n, d),
            onSnapshot: (cb) => {
              if (!ls.has(n)) ls.set(n, new Set());
              ls.get(n).add(cb);
              return () => ls.get(n).delete(cb);
            },
          }),
          start() {
            load().catch(() => setSt("err"));
            setInterval(() => load().catch(() => {}), 30000);
            document.addEventListener("visibilitychange", () => {
              if (!document.hidden) load().catch(() => {});
            });
          },
        };
      }
      const ghLink = () => {
        const t = ($("#ghtok") || {}).value;
        if (!t || !t.trim()) return;
        try {
          localStorage.setItem("dash_gh", t.trim());
          localStorage.removeItem("dash_gid");
          localStorage.removeItem("dash_syn1");
        } catch (e) {}
        location.reload();
      };
      const ghUnlink = () => {
        try {
          localStorage.removeItem("dash_gh");
          localStorage.removeItem("dash_gid");
        } catch (e) {}
        location.reload();
      };
      const ghUI = () =>
        ghTok()
          ? `<button class="btn mt-2" onclick="ghUnlink()">فصل حساب GitHub</button>`
          : `<p class="text-xs mu mt-2">للمزامنة عبر GitHub: أنشئ Token بصلاحية gist فقط من <a href="https://github.com/settings/tokens/new?scopes=gist&description=HatimHub" target="_blank" rel="noopener" style="color:var(--ac2);text-decoration:underline">هذا الرابط</a> ثم الصقه هنا على كل جهاز.</p><input id="ghtok" type="password" placeholder="ghp_..." class="mt-1" autocomplete="off"><button class="btn p mt-2" onclick="ghLink()">ربط GitHub</button>`;
      const vmode = () => {
        try {
          return localStorage.getItem("dash_view") || "auto";
        } catch (e) {
          return "auto";
        }
      };
      const setView = (v) => {
        try {
          v === "auto" ? localStorage.removeItem("dash_view") : localStorage.setItem("dash_view", v);
        } catch (e) {}
        document.documentElement.dataset.dev = __dev();
        settings();
      };
      Object.assign(D, { "⬇️ استرجاع من السحابة": "⬇️ Restore from cloud", "طريقة العرض": "Display mode", تلقائي: "Auto", جوال: "Phone", لابتوب: "Laptop" });
      async function syncInit() {
        try {
          let col = null,
            mode = "";
          if (window.claude && claude.use) {
            const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
            const uid = db && user ? await user.id() : null;
            if (uid) {
              col = db.collection("data/users/" + uid);
              mode = "claude";
            }
          }
          if (!col && ghTok()) {
            setSt("connecting");
            const t = ghTok();
            let gid = localStorage.getItem("dash_gid");
            if (!gid) {
              gid = await ghSetup(t);
              localStorage.setItem("dash_gid", gid);
            }
            col = ghCol(t, gid);
            mode = "gh";
          }
          if (!col) {
            setSt("off");
            return;
          }
          SYNC.col = col;
          SYNC.on = true;
          SYNC.mode = mode;
          setSt("connecting");
          const to = setTimeout(() => {
            if (SYNC.st === "connecting") setSt("err");
          }, 12000);
          SK.forEach((k) =>
            col.doc("hub_" + k).onSnapshot(
              (sn) => {
                if (sn.metadata.fromCache) return;
                clearTimeout(to);
                onRemote(k, sn);
              },
              () => setSt("err"),
            ),
          );
          if (mode === "gh") col.start();
          addEventListener("online", () => {
            if (pend.size) flush();
          });
        } catch (e) {
          setSt("err");
        }
      }
      Object.assign(D, {
        "المزامنة السحابية": "Cloud sync",
        "مزامنة الآن": "Sync now",
        "المزامنة غير مفعّلة": "Sync is off",
        "جارٍ المزامنة…": "Syncing…",
        متزامن: "Synced",
        "غير متصل بالسحابة": "Not connected to cloud",
        "غير مفعّلة. اربط حساب GitHub أدناه، أو افتح الموقع من claude.ai بنفس الحساب.":
          "Off. Link your GitHub account below, or open the site from claude.ai with the same account.",
        "للمزامنة عبر GitHub: أنشئ Token بصلاحية gist فقط من":
          "To sync via GitHub: create a token with the gist scope only from",
        "هذا الرابط": "this link",
        "ثم الصقه هنا على كل جهاز.": "then paste it here on each device.",
        "ربط GitHub": "Link GitHub",
        "فصل حساب GitHub": "Unlink GitHub",
        "مفعّلة: بياناتك تتحدّث تلقائياً بين أجهزتك.":
          "On: your data updates automatically across your devices.",
        "تعذّر الاتصال بالسحابة. تحقق من الإنترنت أو من الـ Token. تُحفظ تغييراتك على الجهاز وتُرسل عند عودة الاتصال.":
          "Could not reach the cloud. Check your connection or token. Changes are saved on this device and sent when you are back online.",
        "مرفق كبير لا يُزامَن، ويبقى على هذا الجهاز فقط.":
          "Attachment too large to sync; it stays on this device only.",
        "المرفق كبير ولم يُزامَن. افتحه من الجهاز الذي أضفته منه.":
          "This attachment is too large to sync. Open it on the device where you added it.",
      });
      applying = true;
      migGear();
      migTypes();
      applying = false;
      initSnap();
      applyLang();
      render();
      setSt("off");
      syncInit();
    </script>
  </body>
</html>
